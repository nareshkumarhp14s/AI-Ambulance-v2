name: ambulance_ai_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^5.2.1
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_messaging: ^16.2.2

  # Maps & Location
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2

  # UI
  google_fonts: ^8.1.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  lottie: ^3.3.3

  # Device Info
  package_info_plus: ^8.0.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.5.0
  freezed: ^3.0.6
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - .env
